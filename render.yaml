services:
  - type: web
    name: muzika-agent
    runtime: python
    plan: free
    buildCommand: pip install -r Muzika/requirements.txt
    startCommand: uvicorn webhook_app:app --app-dir Muzika --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUDD_API_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
