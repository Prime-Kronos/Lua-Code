services:
  - type: web
    name: amu-sazan-menu
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: BOT_TOKEN
        sync: false
      - key: BOT_ADMIN_ID
        sync: false
