rgin-top:6px}.badge.on{background:#12372f;color:#79e8c2}.switch{border:0;width:40px;height:23px;border-radius:20px;background:#344259;position:relative;flex-shrink:0}.switch:before{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:#148a66}.switch.on:before{transform:translateX(17px)}.form{display:none;margin-top:12px;background:#0d1623;border:1px solid #293d56;border-radius:13px;padding:14px}.form.open{display:block;animation:fadein .2s}.field{margin-bottom:10px}.field label{display:block;font-size:10px;color:#b6c8df;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #2b3c54;border-radius:10px;background:#08111c;color:#edf4ff;padding:10px;font-size:12px;outline:none}.field textarea{min-height:85px;resize:vertical}.field :focus{border-color:#7092ff;box-shadow:0 0 0 3px #7194ff20}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{border:1px dashed #334760;border-radius:13px;padding:25px;text-align:center;color:var(--muted);font-size:11px}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.plan{background:#101a27;border:1px solid #2a3b52;border-radius:14px;padding:13px}.plan.active{border-color:#7696ff;box-shadow:0 0 0 1px #7696ff25}.plan h3{font-size:12px;letter-spacing:.1em;margin:0}.price{font-size:20px;font-weight:900;margin:10px 0}.plan ul{font-size:10px;color:#bdcde2;line-height:1.7;padding-left:16px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:#192a40;border:1px solid #385576;border-radius:11px;padding:11px 14px;font-size:11px;z-index:10;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}#backdrop{display:none}

<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||'';const headers={'Content-Type':'application/json','X-Telegram-Init-Data':initData};let settings={},rules=[],plan='FREE',limits={},stats={},connections=0,page='overview';const titles={overview:['Панель управления','Все настройки Business-автоматизации в одном месте.'],commands:['Команды','Создавайте свои slash-команды с заданными ответами.'],keywords:['Ключевые слова','Автоматические ответы на фразы и слова клиентов.'],scenarios:['Сценарии','Правила для отдельных типов обращений.'],faq:['FAQ / база знаний','Храните ответы на часто задаваемые вопросы.'],subscription:['Тариф и лимиты','Текущий план и ограничения вашего аккаунта.'],settings:['Настройки','Профиль бизнеса и поведение автоответов.']};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function notify(t){let x=$('.toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200);tg?.HapticFeedback?.notificationOccurred('success')}
async function api(url,opts={}){let r=await fetch(url,{...opts,headers:{...headers,...opts.headers}}),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||'Запрос не выполнен');return d}
function count(k){return rules.filter(x=>x.kind===k).length}
function list(k){let a=rules.filter(x=>x.kind===k);if(!a.length)return '<div class="empty">Правил пока нет — нажмите «Добавить правило».</div>';return a.map(r=>'<div class="rule"><div class="rulebody"><b>'+esc(r.title||r.trigger_text)+'</b><small>'+esc(r.trigger_text)+' → '+esc(r.response_text)+'</small><span class="badge '+(r.enabled?'on':'')+'">'+(r.enabled?'АКТИВНО':'ПАУЗА')+'</span></div><button class="switch '+(r.enabled?'on':'')+'" data-switch="'+r.id+'"></button><button class="btn alt" data-edit="'+r.id+'">✎</button><button class="btn danger" data-delete="'+r.id+'">×</button></div>').join('')}
function ruleview(k){let cap=limits[k]||0;return '<div class="card s12"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><div class="ctitle">'+({command:'Команды /…',keyword:'Ключевые слова',scenario:'Сценарии'}[k])+'</div><div class="muted">Лимит '+count(k)+' / '+cap+' · тариф '+plan+'</div></div><button class="btn" id="add">＋ Добавить правило</button></div><div>'+list(k)+'</div><div class="form" id="form"><div class="row"><div class="field"><label>Название</label><input id="title" placeholder="Например, Доставка"></div><div class="field"><label>'+(k==='command'?'Команда ( /delivery )':'Триггер / фраза')+'</label><input id="trigger" placeholder="'+(k==='command'?'/delivery':'доставка, курьер, привезти')+'"></div></div>'+(k==='command'?'':'<div class="field"><label>Режим</label><select id="mode"><option value="contains">Содержит текст</option><option value="exact">Точное совпадение</option></select></div>')+'<div class="field"><label>Ответ</label><textarea id="answer" placeholder="Текст автоматического ответа"></textarea></div><div class="actions"><button class="btn" id="save">Сохранить</button><button class="btn alt" id="cancel">Отмена</button></div></div></div>'}
function dashboard(){return '<div class="grid"><div class="card s3"><div class="metric">Текущий тариф<strong>'+plan+'</strong></div><p class="muted">Тариф аккаунта</p></div><div class="card s3"><div class="metric">Business подключений<strong>'+connections+'</strong></div><p class="muted">Подключённые аккаунты</p></div><div class="card s3"><div class="metric">Входящие<strong>'+(stats.incoming||0)+'</strong></div><p class="muted">Учтённые события</p></div><div class="card s3"><div class="metric">Автоответы<strong>'+(stats.replied||0)+'</strong></div><p class="muted">Успешно отправлено</p></div><div class="card s8"><div class="ctitle">Быстрое действие</div><p class="muted">Настройте пользовательскую команду, keyword или сценарий. Правила сохраняются в базе и обрабатываются backend при входящих Business-сообщениях.</p><div class="actions"><button class="btn" data-goto="commands">＋ Команда</button><button class="btn alt" data-goto="keywords">＋ Ключевое слово</button><button class="btn alt" data-goto="scenarios">＋ Сценарий</button></div></div><div class="card s4"><div class="ctitle">Автоматизация</div><div class="rule"><div class="rulebody"><b>Автоответы</b><small>Главный переключатель</small></div><button class="switch '+(settings.auto_reply_enabled?'on':'')+'" data-setting="auto_reply_enabled"></button></div><div class="rule"><div class="rulebody"><b>Приветствие</b><small>Первое сообщение чату</small></div><button class="switch '+(settings.welcome_enabled?'on':'')+'" data-setting="welcome_enabled"></button></div></div><div class="card s6"><div class="ctitle">Команды</div><div class="muted">Использовано '+count('command')+'/'+(limits.command||2)+'</div>'+list('command')+'</div><div class="card s6"><div class="ctitle">Ключевые слова</div><div class="muted">Использовано '+count('keyword')+'/'+(limits.keyword||10)+'</div>'+list('keyword')+'</div></div>'}
function faqpage(){return '<div class="grid"><div class="card s12"><div class="ctitle">FAQ-ответы (старый формат, совместимость)</div><p class="muted">Каждая строка: ключ: ответ. Отдельные команды и keyword правила имеют приоритет.</p><div class="field"><textarea id="faq" placeholder="доставка: Доставляем по Ташкенту…\nцена: Напишите, какой товар интересует…">'+esc(settings.knowledge_text||'')+'</textarea></div><button class="btn" id="savefaq">Сохранить FAQ</button><div class="field" style="margin-top:14px"><label>Проверить совпадение (локально)</label><input id="faqquery" placeholder="Сообщение клиента"></div><div class="muted" id="faqtestresult"></div><button class="btn alt" id="faqtest">Тест совпадения</button></div></div>'}
function plans(){let a=[['FREE','0 сум',2,10,1],['PRO','69 000 сум',5,50,5],['PREMIUM','119 000 сум',10,100,20]];return '<div class="grid"><div class="card s12"><div class="ctitle">Ваш тариф: '+plan+'</div><p class="muted">План назначается сервером. Платёжная система, продление, пробный период и самостоятельное переключение пока не подключены.</p></div><div class="s12 plans">'+a.map(p=>'<div class="plan '+(p[0]===plan?'active':'')+'"><h3>'+p[0]+'</h3><div class="price">'+p[1]+'</div><ul><li>'+p[2]+' команд</li><li>'+p[3]+' keyword правил</li><li>'+p[4]+' сценариев</li></ul><span class="badge">'+(p[0]===plan?'ТЕКУЩИЙ ТАРИФ':'ПЛАН')+'</span></div>').join('')+'</div><div class="card s12"><div class="ctitle">Лимиты</div>'+['command','keyword','scenario'].map(k=>'<div class="muted" style="margin:10px 0">'+({command:'Команды',keyword:'Ключевые слова',scenario:'Сценарии'}[k])+' '+count(k)+' / '+limits[k]+'</div><div style="height:6px;background:#25344a;border-radius:9px;margin-bottom:12px"><div style="width:'+Math.min(100,100*count(k)/Math.max(limits[k],1))+'%;height:6px;background:linear-gradient(90deg,#6b8fff,#50d5ef);border-radius:9px"></div></div>').join('')+'</div></div>'}
function settingspage(){return '<div class="grid"><div class="card s12"><div class="ctitle">Профиль</div><div class="field"><label>Название компании</label><input id="bizname" value="'+esc(settings.business_name||'')+'"></div><div class="field"><label>Язык автоответов</label><select id="lang"><option value="auto">Автоматически</option><option value="ru">Русский</option><option value="uz">O‘zbek</option><option value="en">English</option></select></div><div class="field"><label>Приветствие</label><textarea id="greeting">'+esc(settings.greeting_text||'')+'</textarea></div><div class="field"><label>Ответ вне рабочего времени (пока не реализовано)</label><textarea id="away">'+esc(settings.away_text||'')+'</textarea></div><button class="btn" id="saveSettings">Сохранить</button></div><div class="card s12"><div class="ctitle">Telegram Business</div><p class="muted">Telegram → Настройки → Telegram Business → Чат-боты. Подключите @AvtoXabarApp_bot и выдайте нужные разрешения.</p><button class="btn alt" id="botlink">Открыть бот</button></div></div>'}
function render(){let t=titles[page];$('#heading').textContent=t[0];$('#desc').textContent=t[1];$('#crumb').textContent=page.toUpperCase();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let c=page==='overview'?dashboard():page==='commands'?'<div class="grid">'+ruleview('command')+'</div>':page==='keywords'?'<div class="grid">'+ruleview('keyword')+'</div>':page==='scenarios'?'<div class="grid">'+ruleview('scenario')+'</div>':page==='faq'?faqpage():page==='subscription'?plans():'<div class="grid">'+settingspage()+'</div>';$('#content').innerHTML=c;wire()}
async function refresh(){if(!initData){$('#offline').style.display='block';return}try{let d=await api('/api/app/settings');settings=d.settings||{};rules=d.rules||[];plan=d.plan||'FREE';limits=d.limits||{};stats=d.stats||{};connections=d.business_connections||0;$('#name').textContent=d.user?.first_name||'Workspace';$('#avatar').textContent=(d.user?.first_name||'A').slice(0,1).toUpperCase();$('#sideplan').textContent=plan+' PLAN';render()}catch(e){$('#offline').style.display='block';$('#offline').textContent=e.message}}
function wire(){document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>goto(b.dataset.goto));document.querySelectorAll('[data-setting]').forEach(b=>b.onclick=async()=>{let k=b.dataset.setting;try{await api('/api/app/settings',{method:'POST',body:JSON.stringify({[k]:!settings[k]})});settings[k]=!settings[k];render();notify('Сохранено')}catch(e){notify(e.message)}});document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=async()=>{let r=rules.find(x=>String(x.id)===b.dataset.switch);try{await api('/api/app/rules/'+r.id,{method:'PUT',body:JSON.stringify({enabled:!r.enabled})});await refresh();notify('Правило обновлено')}catch(e){notify(e.message)}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Удалить правило?'))return;try{await api('/api/app/rules/'+b.dataset.delete,{method:'DELETE'});await refresh();notify('Удалено')}catch(e){notify(e.message)}});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let r=rules.find(x=>String(x.id)===b.dataset.edit);let title=prompt('Название правила',r.title||'');if(title===null)return;let trigger=prompt('Триггер',r.trigger_text);if(trigger===null)return;let answer=prompt('Ответ',r.response_text);if(answer===null)return;api('/api/app/rules/'+r.id,{method:'PUT',body:JSON.stringify({title,trigger_text:trigger,response_text:answer})}).then(refresh).then(()=>notify('Изменено')).catch(e=>notify(e.message))});
if($('#add'))$('#add').onclick=()=>$('#form').classList.add('open');if($('#cancel'))$('#cancel').onclick=()=>$('#form').classList.remove('open');if($('#save'))$('#save').onclick=async()=>{let tr=$('#trigger').value.trim(),ans=$('#answer').value.trim();if(!tr||!ans)return notify('Заполните триггер и ответ');try{await api('/api/app/rules',{method:'POST',body:JSON.stringify({kind:page==='commands'?'command':page==='keywords'?'keyword':'scenario',title:$('#title').value,trigger_text:tr,response_text:ans,match_mode:$('#mode')?$('#mode').value:'exact'})});await refresh();notify('Правило создано')}catch(e){notify(e.message)}};
if($('#savefaq'))$('#savefaq').onclick=async()=>{try{await api('/api/app/settings',{method:'POST',body:JSON.stringify({knowledge_text:$('#faq').value})});settings.knowledge_text=$('#faq').value;notify('FAQ сохранён')}catch(e){notify(e.message)}};
if($('#faqtest'))$('#faqtest').onclick=()=>{let q=$('#faqquery').value.toLowerCase(),lines=$('#faq').value.split('\n'),hit=lines.find(x=>x.includes(':')&&q.includes(x.split(':')[0].trim().toLowerCase()));$('#faqtestresult').textContent=hit?'Совпадение: '+hit.split(':').slice(1).join(':').trim():'Не найдено (тест не отправляет Telegram сообщения)'};
if($('#saveSettings'))$('#saveSettings').onclick=async()=>{let v={business_name:$('#bizname').value,reply_language:$('#lang').value,greeting_text:$('#greeting').value,away_text:$('#away').value};try{await api('/api/app/settings',{method:'POST',body:JSON.stringify(v)});Object.assign(settings,v);notify('Настройки сохранены')}catch(e){notify(e.message)}};if($('#lang'))$('#lang').value=settings.reply_language||'auto';if($('#botlink'))$('#botlink').onclick=()=>tg?.openTelegramLink('https://t.me/AvtoXabarApp_bot')}
function goto(p){page=p;render();$('#sidebar').classList.remove('open');$('#backdrop').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'})}
$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)goto(b.dataset.page)};$('#menubtn').onclick=()=>{$('#sidebar').classList.add('open');$('#backdrop').classList.add('show')};$('#backdrop').onclick=()=>{$('#sidebar').classList.remove('open');$('#backdrop').classList.remove('show')};refresh();
<style>
.langgate{position:fixed;inset:0;background:#075ef0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px}.langcard{max-width:420px;width:100%;background:#071b38;border:1px solid #ffffff35;border-radius:24px;padding:25px;text-align:center;box-shadow:0 25px 70px #001b5c70}.langcard h2{margin:4px 0 8px}.langcard p{color:#bed0ec;font-size:12px;line-height:1.5}.langgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.langgrid button{padding:14px 8px;border:1px solid #3b5e89;background:#122f56;color:white;border-radius:13px;font-weight:800}.langmini{display:flex;gap:4px;margin-left:8px}.langmini button{background:#111b2a;border:1px solid #2c405a;color:#b8c9de;border-radius:8px;padding:5px;font-size:10px}.langmini button.active{background:#2564e9;color:#fff}.guidebox{border:1px solid #2b405d;background:#101b2a;border-radius:14px;padding:14px;margin:10px 0}.guidebox h3{font-size:13px;margin:0 0 8px}.guidebox p,.guidebox li{font-size:11px;line-height:1.7;color:#bccce0}.guidebox ol{padding-left:20px}.contactbox{padding:15px;background:linear-gradient(135deg,#17385f,#111b29);border:1px solid #36577a;border-radius:14px}.navsvg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
<div id="langGate" class="langgate"><div class="langcard"><div style="font-size:52px;color:white;font-weight:900">✦</div><h2>AvtoXabar Agent</h2><p id="gateText">Выберите язык интерфейса / Choose your interface language</p><div class="langgrid"><button data-lang="ru">🇷🇺 Русский</button><button data-lang="uz">🇺🇿 O‘zbek · Latin</button><button data-lang="uzc">🇺🇿 Ўзбек · Кирилл</button><button data-lang="en">🇬🇧 English</button></div></div></div>
<script>
const AVX={ru:{nav:['Обзор','Команды','Ключевые слова','Сценарии','FAQ / база знаний','Подписка','Настройки','Инструкция'],heads:['Панель управления','Команды','Ключевые слова','Сценарии','FAQ / база знаний','Тариф и лимиты','Настройки','Инструкция'],descs:['Все настройки Business-автоматизации в одном месте.','Создавайте slash-команды с готовыми ответами.','Автоматические ответы по словам и фразам.','Правила для отдельных типов обращений.','Ответы на часто задаваемые вопросы.','Тарифы, лимиты и запрос PRO.','Профиль и параметры автоответов.','Как подключить Telegram Business и пользоваться функциями.'],add:'＋ Добавить правило',save:'Сохранить',cancel:'Отмена',guide:'Как пользоваться AvtoXabar Agent',connect:'1. Подключение Telegram Business',steps:['Откройте Telegram → Настройки.','Telegram Business → Чат-боты.','Нажмите подключить бота и найдите @AvtoXabarApp_bot.','Выберите необходимые разрешения на обработку и ответы.','Подтвердите подключение и вернитесь в Mini App.'],sections:['2. Автоответы и приветствие','3. Команды','4. Ключевые слова','5. Сценарии','6. FAQ / база знаний','7. Настройки','8. PRO, реклама и сотрудничество'],texts:['В «Обзоре» включите главный переключатель автоответов. Приветствие можно переключать отдельно.','Создайте команду, например /delivery, задайте название и ответ. Slash-команды начинаются с / и предназначены для точного вызова.','Добавьте слова или фразы, выберите режим «Содержит» либо «Точное совпадение», напишите ответ и сохраните.','Сценарии позволяют задать правила для разных обращений. Укажите триггер и ответ; лимит зависит от тарифа.','Каждая строка в FAQ: ключ: ответ. Сохраните, затем используйте тест совпадения. Тест не отправляет сообщения клиентам.','Укажите название бизнеса, язык автоответа и приветствие. Поле away-текста доступно, но расписание и отправка сообщения вне рабочего времени ещё не реализованы.','Для PRO/PREMIUM, рекламы и сотрудничества пишите @VelorOfficial. Payme-автоматическая оплата не подключена; заказ тарифа оформляется вручную.'],contact:'Написать @VelorOfficial',contactnote:'PRO/PREMIUM, реклама, сотрудничество и индивидуальные запросы — через @VelorOfficial. Автоматические платежи пока не включены; никаких сторонних ссылок для оплаты.',tips:'Настройки сохраняются в аккаунте. Не используйте слишком широкие триггеры и не помещайте конфиденциальные данные в автоответы. Если бот не отвечает, проверьте Business-подключение и главный переключатель.'},
uz:{nav:['Umumiy','Buyruqlar','Kalit so‘zlar','Ssenariylar','FAQ / baza','Tarif','Sozlamalar','Yo‘riqnoma'],heads:['Boshqaruv paneli','Buyruqlar','Kalit so‘zlar','Ssenariylar','FAQ / baza','Tarif va limitlar','Sozlamalar','Yo‘riqnoma'],descs:['Avtomatlashtirishni bir joydan boshqaring.','Slash-buyruqlar va javoblar yarating.','So‘z va iboralar asosida avtomatik javob.','Murojaat turlari uchun qoidalar.','Ko‘p so‘raladigan savollarga javoblar.','Tariflar va PRO so‘rovi.','Biznes va javob sozlamalari.','Telegram Business ulash va funksiyalar qo‘llanmasi.'],add:'＋ Qoida qo‘shish',save:'Saqlash',cancel:'Bekor qilish',guide:'AvtoXabar Agent qo‘llanmasi',connect:'1. Telegram Business ulash',steps:['Telegram → Sozlamalarni oching.','Telegram Business → Chat-botlar bo‘limiga kiring.','Bot ulashni bosing va @AvtoXabarApp_bot ni toping.','Xabarlarni qayta ishlash va javob yuborish ruxsatlarini tanlang.','Ulanishni tasdiqlab, Mini App ga qayting.'],sections:['2. Avtojavob va salomlashuv','3. Buyruqlar','4. Kalit so‘zlar','5. Ssenariylar','6. FAQ / bilimlar bazasi','7. Sozlamalar','8. PRO, reklama va hamkorlik'],texts:['Umumiy sahifada avtojavob asosiy tugmasini yoqing. Salomlashuvni alohida boshqarish mumkin.','Masalan /delivery buyrug‘ini yarating, nom va javob kiriting. Slash-buyruq / bilan boshlanadi.','So‘z yoki ibora qo‘shing, «Matn ichida» yoki «Aniq moslik» usulini tanlang, javob yozib saqlang.','Murojaat turlariga qoidalar yarating. Trigger va javob kiriting; limit tarifga bog‘liq.','Har qatorda kalit: javob shaklida yozing. Saqlang va moslik testidan foydalaning; test mijozga xabar yubormaydi.','Biznes nomi, javob tili va salomlashuvni sozlang. Away matni mavjud, ammo ish jadvali va avtomatik yuborish hali yo‘q.','PRO/PREMIUM, reklama va hamkorlik uchun @VelorOfficial ga yozing. Payme avtomatik to‘lovi ulanmagan; tarif qo‘lda kelishiladi.'],contact:'@VelorOfficial ga yozish',contactnote:'PRO/PREMIUM, reklama, hamkorlik va maxsus so‘rovlar uchun @VelorOfficial. Avtomatik to‘lov hali yo‘q.',tips:'Sozlamalar akkauntda saqlanadi. Juda keng triggerlardan va maxfiy ma’lumotdan qoching. Bot javob bermasa Business ulanishi va asosiy tugmani tekshiring.'},
uzc:{nav:['Умумий','Буйруқлар','Калит сўзлар','Сценарийлар','FAQ / база','Тариф','Созламалар','Йўриқнома'],heads:['Бошқарув панели','Буйруқлар','Калит сўзлар','Сценарийлар','FAQ / база','Тариф ва лимитлар','Созламалар','Йўриқнома'],descs:['Автоматлаштиришни бир жойдан бошқаринг.','Slash-буйруқлар ва жавоблар яратинг.','Сўз ва иборалар асосида автоматик жавоб.','Мурожаат турлари учун қоидалар.','Кўп сўраладиган саволларга жавоблар.','Тарифлар ва PRO сўрови.','Бизнес ва жавоб созламалари.','Telegram Business улаш ва функциялар қўлланмаси.'],add:'＋ Қоида қўшиш',save:'Сақлаш',cancel:'Бекор қилиш',guide:'AvtoXabar Agent қўлланмаси',connect:'1. Telegram Business улаш',steps:['Telegram → Созламаларни очинг.','Telegram Business → Чат-ботлар бўлимига киринг.','Бот улашни босиб @AvtoXabarApp_bot ни топинг.','Хабарларни қайта ишлаш ва жавоб юбориш рухсатларини танланг.','Уланишни тасдиқлаб, Mini App га қайтинг.'],sections:['2. Автожавоб ва саломлашув','3. Буйруқлар','4. Калит сўзлар','5. Сценарийлар','6. FAQ / билимлар базаси','7. Созламалар','8. PRO, реклама ва ҳамкорлик'],texts:['Умумий саҳифада автоjavоб асосий тугмасини ёқинг. Саломлашув алоҳида бошқарилади.','Масалан /delivery буйруғини яратинг, ном ва жавоб киритинг. Slash-буйруқ / билан бошланади.','Сўз ёки ибора қўшинг, «Матн ичида» ёки «Аниқ мослик»ни танланг, жавоб ёзиб сақланг.','Мурожаат турларига қоидалар яратинг. Trigger ва жавоб киритинг; лимит тарифга боғлиқ.','Ҳар қаторда калит: жавоб шаклида ёзинг. Сақланг ва мослик тестидан фойдаланинг; тест мижозга хабар юбормайди.','Бизнес номи, жавоб тили ва саломлашувни созланг. Away матни бор, аммо иш жадвали ва автоматик юбориш ҳали йўқ.','PRO/PREMIUM, реклама ва ҳамкорлик учун @VelorOfficial га ёзинг. Payme автоматик тўлови уланмаган; тариф қўлда келишилади.'],contact:'@VelorOfficial га ёзиш',contactnote:'PRO/PREMIUM, реклама, ҳамкорлик ва махсус сўровлар учун @VelorOfficial. Автоматик тўлов ҳали йўқ.',tips:'Созламалар аккаунтда сақланади. Жуда кенг триггерлар ва махфий маълумотдан қочинг. Бот жавоб бермаса Business уланиши ва асосий тугмани текширинг.'},
en:{nav:['Overview','Commands','Keywords','Scenarios','FAQ / knowledge','Subscription','Settings','Guide'],heads:['Dashboard','Commands','Keywords','Scenarios','FAQ / knowledge base','Plans & limits','Settings','Guide'],descs:['Manage your automation in one place.','Create slash commands and replies.','Automatic replies triggered by words or phrases.','Rules for request types.','Answers to common questions.','Plans, limits and PRO requests.','Business and reply preferences.','Connect Telegram Business and use the features.'],add:'＋ Add rule',save:'Save',cancel:'Cancel',guide:'AvtoXabar Agent guide',connect:'1. Connect Telegram Business',steps:['Open Telegram → Settings.','Telegram Business → Chat Bots.','Tap Connect bot and search @AvtoXabarApp_bot.','Grant the permissions needed to process and reply to messages.','Confirm, then return to the Mini App.'],sections:['2. Auto-replies & greeting','3. Commands','4. Keywords','5. Scenarios','6. FAQ / knowledge base','7. Settings','8. PRO, ads & partnerships'],texts:['On Overview, enable the main auto-reply switch. Greeting can be toggled separately.','Create a command like /delivery, set its title and reply. Slash commands start with /.','Add a word or phrase, choose Contains or Exact match, enter a reply and save.','Create rules for different request types. Add trigger and reply; limits depend on plan.','Use one keyword: answer pair per line. Save and run a local test; it does not message customers.','Set business name, reply language and greeting. Away text can be edited, but scheduling and delivery are not implemented yet.','For PRO/PREMIUM, ads or partnerships, message @VelorOfficial. Payme automated payment is not connected; plans are handled manually.'],contact:'Message @VelorOfficial',contactnote:'PRO/PREMIUM, advertising, partnerships and custom requests: @VelorOfficial. Automated payments are not enabled.',tips:'Settings are saved to your account. Avoid broad triggers and private information in replies. If the bot does not respond, check Business connection and the main switch.'}};
let avxCurrent=localStorage.getItem('avx_language')||'';
function avxL(){return AVX[avxCurrent||'ru']}
function avxPick(l){avxCurrent=l;localStorage.setItem('avx_language',l);document.getElementById('langGate').style.display='none';avxNav();avxRender();avxBar()}
function avxBar(){let top=document.querySelector('.top');let old=document.getElementById('langbar');old?.remove();let b=document.createElement('div');b.id='langbar';b.className='langmini';b.innerHTML=['ru','uz','uzc','en'].map(x=>'<button class="'+(x===avxCurrent?'active':'')+'" data-l="'+x+'">'+({ru:'RU',uz:'UZ-L',uzc:'UZ-K',en:'EN'}[x])+'</button>').join('';top.appendChild(b);b.onclick=e=>{let q=e.target.closest('[data-l]');if(q)avxPick(q.dataset.l)}}
function avxIcon(key){let p={overview:'<path d="M3 10 12 3l9 7M5 9v12h14V9M9 21v-6h6v6"/>',commands:'<path d="m8 4-4 4 4 4M16 20l4-4-4-4"/>',keywords:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',scenarios:'<path d="M12 3 21 8v8l-9 5-9-5V8z"/><path d="m8 12 3 3 5-6"/>',faq:'<path d="M5 3h14v18H5zM8 7h8M8 11h8M8 15h5"/>',subscription:'<path d="m12 3 3 6 6 1-4.5 4.5L17 21l-5-3-5 3 1-6.5L3 10l6-1z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 14.5a2 2 0 0 0 1-2.5l-1-2 1-2-2-2-2 1-2-1-1-2h-3L8 4l-2 1-2-1-2 2 1 2-1 2 1 2-1 2 2 2 2-1 2 1 1 2h3l1-2 2-1 2 1 2-2z"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4M12 17h.01"/>'};return '<svg class="navsvg" viewBox="0 0 24 24">'+(p[key]||p.help)+'</svg>'}
function avxNav(){let nav=document.getElementById('nav'),keys=['overview','commands','keywords','scenarios','faq','subscription','settings'];nav.querySelectorAll('[data-page]').forEach(b=>{let i=keys.indexOf(b.dataset.page);if(i>=0)b.innerHTML=avxIcon(b.dataset.page)+avxL().nav[i]});let labels=nav.querySelectorAll('.navlabel');if(labels[0])labels[0].textContent=avxCurrent==='ru'?'РАБОЧЕЕ ПРОСТРАНСТВО':avxCurrent==='en'?'WORKSPACE':avxCurrent==='uzc'?'ИШ МАЙДОНИ':'ISH MAYDONI';if(labels[1])labels[1].textContent=avxCurrent==='ru'?'АККАУНТ':avxCurrent==='en'?'ACCOUNT':avxCurrent==='uzc'?'АККАУНТ':'AKKAUNT';let h=document.getElementById('helpnav');if(!h){h=document.createElement('button');h.id='helpnav';h.dataset.page='help';nav.appendChild(h)}h.innerHTML=avxIcon('help')+avxL().nav[7];}
function avxGuide(){let l=avxL();return '<div class="grid"><div class="card s12"><div class="ctitle">'+l.guide+'</div><div class="guidebox"><h3>'+l.connect+'</h3><ol>'+l.steps.map(x=>'<li>'+x+'</li>').join('')+'</ol></div>'+l.sections.map((s,i)=>'<div class="guidebox"><h3>'+s+'</h3><p>'+l.texts[i]+'</p></div>').join('')+'<div class="guidebox"><h3>✓</h3><p>'+l.tips+'</p><div class="contactbox"><p>'+l.contactnote+'</p><button class="btn" id="contactVelor">'+l.contact+'</button></div></div></div></div>'}
function avxRender(){let l=avxL(),keys=['overview','commands','keywords','scenarios','faq','subscription','settings','help'],idx=keys.indexOf(page);if(idx<0)return;document.getElementById('heading').textContent=l.heads[idx];document.getElementById('desc').textContent=l.descs[idx];document.getElementById('crumb').textContent=l.nav[idx].toUpperCase();if(page==='help'){document.getElementById('content').innerHTML=avxGuide();let c=document.getElementById('contactVelor');if(c)c.onclick=()=>tg?.openTelegramLink('https://t.me/VelorOfficial');}}
const avxRenderBase=render;
render=function(){avxRenderBase();avxNav();avxBar();avxRender();};
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>avxPick(b.dataset.lang));
if(!avxCurrent)document.getElementById('langGate').style.display='flex';else{avxNav();avxBar();avxRender()}
</script></body></html>
