<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c15"><title>AvtoXabar Agent</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#080c15;--card:#121a27;--line:#27364c;--txt:#eff5ff;--muted:#91a3bc;--blue:#6d8fff;--mint:#4bd7a5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#20365a,transparent 40%),var(--bg);color:var(--txt);font:14px Inter,system-ui,sans-serif}#sidebar{position:fixed;inset:0 auto 0 0;width:244px;background:#0d131e;border-right:1px solid var(--line);padding:20px 13px;display:flex;flex-direction:column;z-index:4;transition:transform .3s cubic-bezier(.2,.8,.2,1)}.brand{display:flex;gap:10px;align-items:center;padding:3px 8px 24px}.logo{height:38px;width:38px;border-radius:12px;background:linear-gradient(135deg,#6b8fff,#50d5ee);color:#07121c;font-weight:950;display:grid;place-items:center;box-shadow:0 0 26px #6b8fff35}.brand b{font-size:13px;letter-spacing:.05em}.brand small{display:block;color:#86a3d0;font-size:9px;letter-spacing:.16em;margin-top:4px}.navlabel{font-size:9px;color:#60728e;letter-spacing:.15em;font-weight:900;padding:10px}.nav{display:grid;gap:5px}.nav button{border:1px solid transparent;background:none;color:#aab8cc;padding:11px;border-radius:12px;text-align:left;display:flex;gap:12px;align-items:center;font-weight:700;font-size:12px;transition:.22s}.nav button:hover{transform:translateX(4px);background:#172335;color:#fff}.nav button.active{background:linear-gradient(90deg,#1d2d49,#152238);border-color:#324965;color:white;box-shadow:inset 3px 0 #7596ff}.nav button.active span{filter:drop-shadow(0 0 6px #7a9aff)}.nav span{font-size:16px;width:20px;text-align:center}.sidebarbottom{margin-top:auto;padding:12px;border:1px solid #2a3c58;border-radius:14px;background:linear-gradient(140deg,#15243a,#111823)}.sidebarbottom p{font-size:11px;color:var(--muted);line-height:1.5}.main{margin-left:244px;padding:25px clamp(14px,3vw,35px);min-height:100vh}.top{display:flex;align-items:center;gap:10px;margin-bottom:24px}.crumb{font-size:10px;letter-spacing:.14em;color:#8ca6ca;font-weight:900}.menu{display:none}.profile{margin-left:auto;border:1px solid var(--line);background:#111a27;padding:8px 11px;border-radius:12px;display:flex;align-items:center;gap:9px;font-size:11px}.avatar{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#8ba6ff,#4ed3eb);display:grid;place-items:center;color:#09131d;font-weight:900}.head{margin-bottom:20px}.head h1{font-size:27px;letter-spacing:-.04em;margin:0 0 7px}.head p{font-size:12px;color:var(--muted);margin:0}.content{animation:fadein .23s ease}@keyframes fadein{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}.card{background:linear-gradient(150deg,#141e2d,#0e1520);border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:0 13px 25px #0002}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}.metric{font-size:10px;color:var(--muted)}.metric strong{display:block;font-size:25px;color:#f3f7ff;margin-top:7px}.ctitle{font-weight:850;font-size:13px;margin-bottom:10px}.muted{color:var(--muted);font-size:11px;line-height:1.6}.btn{border:0;border-radius:11px;background:linear-gradient(115deg,#6688ff,#4bbce9);color:#fff;padding:10px 13px;font-weight:850;font-size:11px;transition:.2s;box-shadow:0 7px 20px #4d8dff22}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn.alt{background:#17263b;border:1px solid #30445f;box-shadow:none}.btn.danger{background:#44232e;border:1px solid #703646;box-shadow:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.rule{border:1px solid #26374e;background:#101927;border-radius:12px;padding:11px;display:flex;align-items:center;gap:9px;margin:8px 0}.rulebody{flex:1;min-width:0}.rulebody b{font-size:12px;display:block}.rulebody small{font-size:10px;color:var(--muted);display:block;margin-top:5px;overflow-wrap:anywhere}.badge{display:inline-block;background:#1e3554;color:#c5dcff;font-size:9px;font-weight:900;padding:5px 8px;border-radius:99px;margin-top:6px}.badge.on{background:#12372f;color:#79e8c2}.switch{border:0;width:40px;height:23px;border-radius:20px;background:#344259;position:relative;flex-shrink:0}.switch:before{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:#148a66}.switch.on:before{transform:translateX(17px)}.form{display:none;margin-top:12px;background:#0d1623;border:1px solid #293d56;border-radius:13px;padding:14px}.form.open{display:block;animation:fadein .2s}.field{margin-bottom:10px}.field label{display:block;font-size:10px;color:#b6c8df;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #2b3c54;border-radius:10px;background:#08111c;color:#edf4ff;padding:10px;font-size:12px;outline:none}.field textarea{min-height:85px;resize:vertical}.field :focus{border-color:#7092ff;box-shadow:0 0 0 3px #7194ff20}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{border:1px dashed #334760;border-radius:13px;padding:25px;text-align:center;color:var(--muted);font-size:11px}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.plan{background:#101a27;border:1px solid #2a3b52;border-radius:14px;padding:13px}.plan.active{border-color:#7696ff;box-shadow:0 0 0 1px #7696ff25}.plan h3{font-size:12px;letter-spacing:.1em;margin:0}.price{font-size:20px;font-weight:900;margin:10px 0}.plan ul{font-size:10px;color:#bdcde2;line-height:1.7;padding-left:16px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:#192a40;border:1px solid #385576;border-radius:11px;padding:11px 14px;font-size:11px;z-index:10;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}#backdrop{display:none}
@media(max-width:980px){.s3,.s4{grid-column:span 6}.s8{grid-column:span 12}}
@media(max-width:650px){#sidebar{transform:translateX(-110%);width:265px;box-shadow:25px 0 70px #0008}#sidebar.open{transform:translateX(0)}#backdrop.show{display:block;position:fixed;inset:0;background:#0008;z-index:3}.main{margin:0;padding:16px 13px}.menu{display:block;border:1px solid #2a3b51;background:#121c29;color:#fff;border-radius:10px;padding:8px 10px}.s3,.s4,.s6,.s8,.s12{grid-column:span 12}.plans{grid-template-columns:1fr}.row{grid-template-columns:1fr}.head h1{font-size:24px}.profile span{display:none}}
</style></head><body><aside id="sidebar"><div class="brand"><div class="logo">A</div><div><b>AVTOXABAR AGENT</b><small>BUSINESS AUTOMATION</small></div></div><div class="navlabel">WORKSPACE</div><nav class="nav" id="nav"><button class="active" data-page="overview"><span>⌂</span>Обзор</button><button data-page="commands"><span>⌘</span>Команды</button><button data-page="keywords"><span>⌕</span>Ключевые слова</button><button data-page="scenarios"><span>◈</span>Сценарии</button><button data-page="faq"><span>▤</span>FAQ / база знаний</button><div class="navlabel">ACCOUNT</div><button data-page="subscription"><span>✦</span>Подписка</button><button data-page="settings"><span>⚙</span>Настройки</button></nav><div class="sidebarbottom"><b id="sideplan">FREE PLAN</b><p>Ваш конструктор Business-автоматизации.</p><button class="btn alt" data-goto="subscription">Тариф и лимиты →</button></div></aside><div id="backdrop"></div><main class="main"><div class="top"><button class="menu" id="menubtn">☰</button><div class="crumb">AVTOXABAR / <span id="crumb">OVERVIEW</span></div><div class="profile"><div class="avatar" id="avatar">A</div><span id="name">Business workspace</span></div></div><div class="head"><h1 id="heading">Панель управления</h1><p id="desc">Всё управление автоматизацией Telegram Business — в одном месте.</p></div><div id="offline" class="card" style="display:none;color:#ffb7c1">Откройте Mini App через @AvtoXabar_agent для авторизации.</div><div id="content" class="content"></div></main><div class="toast" id="toast"></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||'';const headers={'Content-Type':'application/json','X-Telegram-Init-Data':initData};let settings={},rules=[],plan='FREE',limits={},stats={},connections=0,page='overview';const titles={overview:['Панель управления','Все настройки Business-автоматизации в одном месте.'],commands:['Команды','Создавайте свои slash-команды с заданными ответами.'],keywords:['Ключевые слова','Автоматические ответы на фразы и слова клиентов.'],scenarios:['Сценарии','Правила для отдельных типов обращений.'],faq:['FAQ / база знаний','Храните ответы на часто задаваемые вопросы.'],subscription:['Тариф и лимиты','Текущий план и ограничения вашего аккаунта.'],settings:['Настройки','Профиль бизнеса и поведение автоответов.']};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function notify(t){let x=$('.toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200);tg?.HapticFeedback?.notificationOccurred('success')}
async function api(url,opts={}){let r=await fetch(url,{...opts,headers:{...headers,...opts.headers}}),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||'Запрос не выполнен');return d}
function count(k){return rules.filter(x=>x.kind===k).length}
function list(k){let a=rules.filter(x=>x.kind===k);if(!a.length)return '<div class="empty">Правил пока нет — нажмите «Добавить правило».</div>';return a.map(r=>'<div class="rule"><div class="rulebody"><b>'+esc(r.title||r.trigger_text)+'</b><small>'+esc(r.trigger_text)+' → '+esc(r.response_text)+'</small><span class="badge '+(r.enabled?'on':'')+'">'+(r.enabled?'АКТИВНО':'ПАУЗА')+'</span></div><button class="switch '+(r.enabled?'on':'')+'" data-switch="'+r.id+'"></button><button class="btn alt" data-edit="'+r.id+'">✎</button><button class="btn danger" data-delete="'+r.id+'">×</button></div>').join('')}
function ruleview(k){let cap=limits[k]||0;return '<div class="card s12"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><div class="ctitle">'+({command:'Команды /…',keyword:'Ключевые слова',scenario:'Сценарии'}[k])+'</div><div class="muted">Лимит '+count(k)+' / '+cap+' · тариф '+plan+'</div></div><button class="btn" id="add">＋ Добавить правило</button></div><div>'+list(k)+'</div><div class="form" id="form"><div class="row"><div class="field"><label>Название</label><input id="title" placeholder="Например, Доставка"></div><div class="field"><label>'+(k==='command'?'Команда ( /delivery )':'Триггер / фраза')+'</label><input id="trigger" placeholder="'+(k==='command'?'/delivery':'доставка, курьер, привезти')+'"></div></div>'+(k==='command'?'':'<div class="field"><label>Режим</label><select id="mode"><option value="contains">Содержит текст</option><option value="exact">Точное совпадение</option></select></div>')+'<div class="field"><label>Ответ</label><textarea id="answer" placeholder="Текст автоматического ответа"></textarea></div><div class="actions"><button class="btn" id="save">Сохранить</button><button class="btn alt" id="cancel">Отмена</button></div></div></div>'}
function dashboard(){return '<div class="grid"><div class="card s3"><div class="metric">Текущий тариф<strong>'+plan+'</strong></div><p class="muted">Тариф аккаунта</p></div><div class="card s3"><div class="metric">Business подключений<strong>'+connections+'</strong></div><p class="muted">Подключённые аккаунты</p></div><div class="card s3"><div class="metric">Входящие<strong>'+(stats.incoming||0)+'</strong></div><p class="muted">Учтённые события</p></div><div class="card s3"><div class="metric">Автоответы<strong>'+(stats.replied||0)+'</strong></div><p class="muted">Успешно отправлено</p></div><div class="card s8"><div class="ctitle">Быстрое действие</div><p class="muted">Настройте пользовательскую команду, keyword или сценарий. Правила сохраняются в базе и обрабатываются backend при входящих Business-сообщениях.</p><div class="actions"><button class="btn" data-goto="commands">＋ Команда</button><button class="btn alt" data-goto="keywords">＋ Ключевое слово</button><button class="btn alt" data-goto="scenarios">＋ Сценарий</button></div></div><div class="card s4"><div class="ctitle">Автоматизация</div><div class="rule"><div class="rulebody"><b>Автоответы</b><small>Главный переключатель</small></div><button class="switch '+(settings.auto_reply_enabled?'on':'')+'" data-setting="auto_reply_enabled"></button></div><div class="rule"><div class="rulebody"><b>Приветствие</b><small>Первое сообщение чату</small></div><button class="switch '+(settings.welcome_enabled?'on':'')+'" data-setting="welcome_enabled"></button></div></div><div class="card s6"><div class="ctitle">Команды</div><div class="muted">Использовано '+count('command')+'/'+(limits.command||2)+'</div>'+list('command')+'</div><div class="card s6"><div class="ctitle">Ключевые слова</div><div class="muted">Использовано '+count('keyword')+'/'+(limits.keyword||10)+'</div>'+list('keyword')+'</div></div>'}
function faqpage(){return '<div class="grid"><div class="card s12"><div class="ctitle">FAQ-ответы (старый формат, совместимость)</div><p class="muted">Каждая строка: ключ: ответ. Отдельные команды и keyword правила имеют приоритет.</p><div class="field"><textarea id="faq" placeholder="доставка: Доставляем по Ташкенту…\nцена: Напишите, какой товар интересует…">'+esc(settings.knowledge_text||'')+'</textarea></div><button class="btn" id="savefaq">Сохранить FAQ</button><div class="field" style="margin-top:14px"><label>Проверить совпадение (локально)</label><input id="faqquery" placeholder="Сообщение клиента"></div><div class="muted" id="faqtestresult"></div><button class="btn alt" id="faqtest">Тест совпадения</button></div></div>'}
function plans(){let a=[['FREE','0 сум',2,10,1],['PRO','69 000 сум',5,50,5],['PREMIUM','119 000 сум',10,100,20]];return '<div class="grid"><div class="card s12"><div class="ctitle">Ваш тариф: '+plan+'</div><p class="muted">План назначается сервером. Платёжная система, продление, пробный период и самостоятельное переключение пока не подключены.</p></div><div class="s12 plans">'+a.map(p=>'<div class="plan '+(p[0]===plan?'active':'')+'"><h3>'+p[0]+'</h3><div class="price">'+p[1]+'</div><ul><li>'+p[2]+' команд</li><li>'+p[3]+' keyword правил</li><li>'+p[4]+' сценариев</li></ul><span class="badge">'+(p[0]===plan?'ТЕКУЩИЙ ТАРИФ':'ПЛАН')+'</span></div>').join('')+'</div><div class="card s12"><div class="ctitle">Лимиты</div>'+['command','keyword','scenario'].map(k=>'<div class="muted" style="margin:10px 0">'+({command:'Команды',keyword:'Ключевые слова',scenario:'Сценарии'}[k])+' '+count(k)+' / '+limits[k]+'</div><div style="height:6px;background:#25344a;border-radius:9px;margin-bottom:12px"><div style="width:'+Math.min(100,100*count(k)/Math.max(limits[k],1))+'%;height:6px;background:linear-gradient(90deg,#6b8fff,#50d5ef);border-radius:9px"></div></div>').join('')+'</div></div>'}
function settingspage(){return '<div class="grid"><div class="card s12"><div class="ctitle">Профиль</div><div class="field"><label>Название компании</label><input id="bizname" value="'+esc(settings.business_name||'')+'"></div><div class="field"><label>Язык автоответов</label><select id="lang"><option value="auto">Автоматически</option><option value="ru">Русский</option><option value="uz">O‘zbek</option><option value="en">English</option></select></div><div class="field"><label>Приветствие</label><textarea id="greeting">'+esc(settings.greeting_text||'')+'</textarea></div><div class="field"><label>Ответ вне рабочего времени (пока не реализовано)</label><textarea id="away">'+esc(settings.away_text||'')+'</textarea></div><button class="btn" id="saveSettings">Сохранить</button></div><div class="card s12"><div class="ctitle">Telegram Business</div><p class="muted">Telegram → Настройки → Telegram Business → Чат-боты. Подключите @AvtoXabar_agent и выдайте нужные разрешения.</p><button class="btn alt" id="botlink">Открыть бот</button></div></div>'}
function render(){let t=titles[page];$('#heading').textContent=t[0];$('#desc').textContent=t[1];$('#crumb').textContent=page.toUpperCase();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let c=page==='overview'?dashboard():page==='commands'?'<div class="grid">'+ruleview('command')+'</div>':page==='keywords'?'<div class="grid">'+ruleview('keyword')+'</div>':page==='scenarios'?'<div class="grid">'+ruleview('scenario')+'</div>':page==='faq'?faqpage():page==='subscription'?plans():'<div class="grid">'+settingspage()+'</div>';$('#content').innerHTML=c;wire()}
async function refresh(){if(!initData){$('#offline').style.display='block';return}try{let d=await api('/api/app/settings');settings=d.settings||{};rules=d.rules||[];plan=d.plan||'FREE';limits=d.limits||{};stats=d.stats||{};connections=d.business_connections||0;$('#name').textContent=d.user?.first_name||'Workspace';$('#avatar').textContent=(d.user?.first_name||'A').slice(0,1).toUpperCase();$('#sideplan').textContent=plan+' PLAN';render()}catch(e){$('#offline').style.display='block';$('#offline').textContent=e.message}}
function wire(){document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>goto(b.dataset.goto));document.querySelectorAll('[data-setting]').forEach(b=>b.onclick=async()=>{let k=b.dataset.setting;try{await api('/api/app/settings',{method:'POST',body:JSON.stringify({[k]:!settings[k]})});settings[k]=!settings[k];render();notify('Сохранено')}catch(e){notify(e.message)}});document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=async()=>{let r=rules.find(x=>String(x.id)===b.dataset.switch);try{await api('/api/app/rules/'+r.id,{method:'PUT',body:JSON.stringify({enabled:!r.enabled})});await refresh();notify('Правило обновлено')}catch(e){notify(e.message)}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Удалить правило?'))return;try{await api('/api/app/rules/'+b.dataset.delete,{method:'DELETE'});await refresh();notify('Удалено')}catch(e){notify(e.message)}});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let r=rules.find(x=>String(x.id)===b.dataset.edit);let title=prompt('Название правила',r.title||'');if(title===null)return;let trigger=prompt('Триггер',r.trigger_text);if(trigger===null)return;let answer=prompt('Ответ',r.response_text);if(answer===null)return;api('/api/app/rules/'+r.id,{method:'PUT',body:JSON.stringify({title,trigger_text:trigger,response_text:answer})}).then(refresh).then(()=>notify('Изменено')).catch(e=>notify(e.message))});
if($('#add'))$('#add').onclick=()=>$('#form').classList.add('open');if($('#cancel'))$('#cancel').onclick=()=>$('#form').classList.remove('open');if($('#save'))$('#save').onclick=async()=>{let tr=$('#trigger').value.trim(),ans=$('#answer').value.trim();if(!tr||!ans)return notify('Заполните триггер и ответ');try{await api('/api/app/rules',{method:'POST',body:JSON.stringify({kind:page==='commands'?'command':page==='keywords'?'keyword':'scenario',title:$('#title').value,trigger_text:tr,response_text:ans,match_mode:$('#mode')?$('#mode').value:'exact'})});await refresh();notify('Правило создано')}catch(e){notify(e.message)}};
if($('#savefaq'))$('#savefaq').onclick=async()=>{try{await api('/api/app/settings',{method:'POST',body:JSON.stringify({knowledge_text:$('#faq').value})});settings.knowledge_text=$('#faq').value;notify('FAQ сохранён')}catch(e){notify(e.message)}};
if($('#faqtest'))$('#faqtest').onclick=()=>{let q=$('#faqquery').value.toLowerCase(),lines=$('#faq').value.split('\n'),hit=lines.find(x=>x.includes(':')&&q.includes(x.split(':')[0].trim().toLowerCase()));$('#faqtestresult').textContent=hit?'Совпадение: '+hit.split(':').slice(1).join(':').trim():'Не найдено (тест не отправляет Telegram сообщения)'};
if($('#saveSettings'))$('#saveSettings').onclick=async()=>{let v={business_name:$('#bizname').value,reply_language:$('#lang').value,greeting_text:$('#greeting').value,away_text:$('#away').value};try{await api('/api/app/settings',{method:'POST',body:JSON.stringify(v)});Object.assign(settings,v);notify('Настройки сохранены')}catch(e){notify(e.message)}};if($('#lang'))$('#lang').value=settings.reply_language||'auto';if($('#botlink'))$('#botlink').onclick=()=>tg?.openTelegramLink('https://t.me/AvtoXabar_agent')}
function goto(p){page=p;render();$('#sidebar').classList.remove('open');$('#backdrop').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'})}
$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)goto(b.dataset.page)};$('#menubtn').onclick=()=>{$('#sidebar').classList.add('open');$('#backdrop').classList.add('show')};$('#backdrop').onclick=()=>{$('#sidebar').classList.remove('open');$('#backdrop').classList.remove('show')};refresh();
</script></body></html>
