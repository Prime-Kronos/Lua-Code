services:
  - type: web
    name: avtoxabar-agent
    runtime: python
    plan: free
    region: singapore
    buildCommand: cd avtoxabar-agent && pip install -r requirements.txt
    startCommand: cd avtoxabar-agent && uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
